name: GitHub 金融开源项目定时搜索

on:
  schedule:
    # 每日 UTC 18:00（北京时间凌晨 2:00）
    - cron: "0 18 * * *"
  workflow_dispatch:
    # 手动触发

permissions:
  contents: write  # 用于 git push 提交结果

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，确保 rebase 可用

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r scripts/requirements.txt

      - name: 运行搜索脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/github_search.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 关键：checkout 默认处于 detached HEAD，
          # 必须切换到分支再操作，否则 commit 不会更新 refs/heads/main
          git checkout main

          # 先拉取远程最新，避免冲突
          git pull --rebase origin main

          git add results/ docs/

          # 仅在有变更时提交
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "docs: 更新搜索结果 ($(date +%Y-%m-%d))"
            git push origin main
          fi
