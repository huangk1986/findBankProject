name: GitHub 金融开源项目定时搜索

on:
  schedule:
    # 每日 UTC 18:00（北京时间凌晨 2:00）
    - cron: "0 18 * * *"
  workflow_dispatch:
    # 手动触发

permissions:
  contents: write  # 用于 git push 提交结果

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # 明确指定分支，避免 detached HEAD 导致的后续问题

      - name: 同步远程最新
        run: |
          # 强制对齐本地到远程最新状态（不用 rebase，避免残留冲突）
          git fetch origin main
          git reset --hard origin/main
          echo "已同步至: $(git rev-parse --short HEAD)"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r scripts/requirements.txt

      - name: 运行搜索脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/github_search.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/ docs/

          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "docs: 更新搜索结果 ($(date +%Y-%m-%d))"
            # 直推；若远程领先（极端并发场景），用 force-with-lease 兜底
            git push origin main || git push --force-with-lease origin main
          fi
