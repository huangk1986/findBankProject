name: GitHub 金融开源项目定时搜索

on:
  schedule:
    # 每日 UTC 18:00（北京时间凌晨 2:00）
    - cron: "0 18 * * *"
  workflow_dispatch:
    # 手动触发

# 同一时刻只允许一个搜索工作流运行，后续排队等待
concurrency:
  group: github-search
  cancel-in-progress: false

permissions:
  contents: write  # 用于 git push 提交结果

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # 明确指定分支，避免 detached HEAD 导致的后续问题

      - name: 同步远程最新
        run: |
          # 强制对齐本地到远程最新状态（不用 rebase，避免残留冲突）
          git fetch origin main
          git reset --hard origin/main
          echo "已同步至: $(git rev-parse --short HEAD)"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r scripts/requirements.txt

      - name: 运行搜索脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/github_search.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/ docs/

          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            COMMIT_MSG="docs: 更新搜索结果 ($(date +%Y-%m-%d))"
            git commit -m "$COMMIT_MSG"

            # 推送前重新拉取远程最新，避免并发时本地追踪引用过期
            git fetch origin main

            if git push origin main; then
              echo "直推成功"
            else
              # 远程领先：将本机提交重放到远程最新之上
              # --strategy-option theirs：冲突时取本机版本（rebase 语义中 theirs=本机）
              if git rebase --strategy-option theirs origin/main; then
                git push origin main
              else
                # rebase 仍冲突（如 add/add），回退后强制推送
                git rebase --abort
                echo "[WARN] rebase 冲突，使用 force-with-lease 推送"
                git push --force-with-lease origin main
              fi
            fi
          fi
